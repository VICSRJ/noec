name: Production — Next.js to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          NODE_ENV: production
        run: npm run build

      - name: Validate static export
        shell: bash
        run: |
          set -euo pipefail
          test -d out
          test -s out/index.html
          test -s out/robots.txt
          test -s out/sitemap.xml
          test -f out/.nojekyll
          grep -q 'https://vicsrj.github.io/noec/' out/sitemap.xml
          if grep -R -q '"/_next/' out; then
            echo "Found root-relative /_next asset paths; GitHub Pages base path would break them."
            exit 1
          fi
          file_count=$(find out -type f | wc -l)
          test "${file_count}" -gt 5
          echo "Static export validated: $(du -sh out | cut -f1), ${file_count} files"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
